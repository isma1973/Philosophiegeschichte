<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
    <link rel="shortcut icon" href="assets/img/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz – Philosophiegeschichte</title>
    <meta name="description" content="Interaktives Quiz zu einer Epoche der Philosophiegeschichte.">
    <!-- Ismail UI Framework Core -->
    <link rel="stylesheet" href="assets/css/core.css">
    <link rel="stylesheet" href="assets/css/core-theme.css">
    <link rel="stylesheet" href="assets/css/core-ui.css">
    <link rel="stylesheet" href="assets/css/ui-kit.css">
    <!-- Custom styles (muss nach dem Framework kommen) -->
    <link rel="stylesheet" href="assets/css/custom.css">
</head>
<body>
    <div class="quiz-container" id="quizContainer">
        <header class="quiz-toolbar">
            <div>
                <a class="quiz-home-link" href="index.html">← Übersicht</a>
                <h1 id="quizTitle">Quiz</h1>
            </div>
            <label class="ios-switch" for="themeToggle">
                <span class="sr-only">Dark Mode umschalten</span>
                <input type="checkbox" id="themeToggle">
                <span class="slider"></span>
            </label>
        </header>

        <div id="quizStartScreen" class="quiz-start-screen">
            <h2>Wähle deinen Schwierigkeitsgrad</h2>
            <p>Bist du bereit, dein Wissen auf die Probe zu stellen?</p>
            <div class="difficulty-buttons">
                <button id="btnEasy" class="difficulty-btn easy-btn">
                    <strong>Einfach</strong>
                    <span>3 Fragen</span>
                </button>
                <button id="btnAdvanced" class="difficulty-btn advanced-btn">
                    <strong>Fortgeschritten</strong>
                    <span>7 Fragen <br><small>(inkl. Belohnung)</small></span>
                </button>
            </div>
            <div class="quiz-cheat-container">
                <button id="btnCheatGallery" class="quiz-cheat-btn">Abkürzung: Direkt zur Galerie</button>
            </div>
        </div>

        <div id="quizContent" class="hidden">
            <div id="questionBlock" class="question"></div>
            <div class="answers" id="answersBlock"></div>
            <button id="nextBtn" class="btn btn-primary hidden">Nächste Frage</button>
            <div class="result" id="resultBlock"></div>
        </div>
    </div>

    <!-- Slideshow Modal -->
    <div id="slideshowModal" class="slideshow-modal hidden">
        <div class="slideshow-modal-content">
            <button id="closeModalBtn" class="slideshow-close-btn">&times;</button>
            <div id="slideshowContainer" class="slideshow-container">
                <!-- Slides will be injected here via JS -->
            </div>
            <button id="prevSlideBtn" class="slide-nav prev-slide">&#10094;</button>
            <button id="nextSlideBtn" class="slide-nav next-slide">&#10095;</button>
        </div>
    </div>

    <script src="assets/js/theme.js"></script>
    <script src="assets/js/philosopher-profile.js"></script>
    <script src="assets/js/quiz.js"></script>
</body>
</html>
